app_id: org.nimiplatform.sillytavern
display_name: SillyTavern
version: 1.19.7
profile: standalone
npm_package_name: sillytavern
cargo_package_name: sillytavern-shell
tauri_identifier: ai.nimi.apps.org.nimiplatform.sillytavern
package_author: SillyTavern contributors
submission_role: developer-submitted-input
capability_contract_refs:
  - text.generate
  - text.embed
  - image.generate
  - audio.synthesize
  - audio.transcribe
  - text.decide
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: ~/Library/Application Support/SillyTavern-Nimi
      purpose: Character cards, Persona, chats, world books, settings, media, backups and retrieval indexes. Shared between development and local installation; independent of Nimi accounts.
      expected_size_band: User-controlled; megabytes for text, potentially multiple gigabytes for media and indexes.
    - path_pattern: "%APPDATA%/SillyTavern-Nimi"
      purpose: Character cards, Persona, chats, world books, settings, media, backups and retrieval indexes on Windows; independent of Nimi accounts.
      expected_size_band: User-controlled; megabytes to multiple gigabytes.
safety_profile:
  ai:
    direct_interaction: true
    interaction_notice: absent
    outputs:
      - export_visible_marking: absent
        exposure: publishable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: text
        publication_control: automatic
      - export_visible_marking: absent
        exposure: exportable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: image
        publication_control: not-applicable
      - export_visible_marking: absent
        exposure: exportable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: audio
        publication_control: not-applicable
    risk_features: []
    subject_notice: not-applicable
  content_descriptors:
    - sexual-content
    - violence
    - strong-language
    - unmoderated-shared-content
  data_practices:
    commercial_features: []
    publisher_direct_external_network: true
    sensitive_data_categories: []
    telemetry: []
    third_party_account: optional
    user_content_sharing: public
  high_impact_decision_uses: []
  intended_audience: adult
support_manifest:
  diagnostics_bundle_fields:
    - app_version
    - runtime_status
  redaction_rules:
    - credentials
  user_visible_issue_categories:
    - startup
    - runtime
  escalation_path: README.md#support
  kill_switch_visibility: visible
  recovery_instructions: Restart the App from Nimi. If the problem persists, reinstall the current admitted release.
review_inputs:
  manifest: nimi.app.yaml
  build_profile: .nimi/config/build-profile.yaml
  scaffold_boundary: .nimi/contracts/scaffold-boundary.yaml
admission_truth: platform-owned-after-review
